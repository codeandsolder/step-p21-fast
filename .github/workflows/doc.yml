name: Documentation links

on:
  push:
    branches: [master]
  pull_request:
  merge_group:

permissions:
  contents: read

# Ensure new commits to a PR supersede queued work, preserving main pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  markdown-link-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368 # v1
        with:
          config-file: markdown-link-check.json

  merge-gate:
    name: Documentation merge gate
    if: ${{ always() }}
    needs: [markdown-link-check]
    uses: codeandsolder/ci-workflows/.github/workflows/merge-gate.yml@db22785ec97c653cf0ec96b6964ded8158436f3c # main
    with:
      needs-json: ${{ toJSON(needs) }}
      expected-results: |
        [["markdown-link-check","success"]]
