name: Rust CI

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Test, lint, docs, EXPRESS regression
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@e39ba876b351c5ea4bc01ac906305729b2fe7565 # main
    with:
      rust-components: "clippy rustfmt"
      command: |
        cargo test --workspace --all-features --locked
        cargo doc --workspace --no-deps --all-features --locked
        # Validate the full EXPRESS grammar without regenerating checked-in
        # AP modules: their historical token formatting is not canonical.
        for ap in 201 203; do
          cargo run --release --locked --bin expressc -- "./schemas/APs/10303-${ap}-aim-long.exp" --check
        done

  strict-rust:
    name: Strict Rust
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@7d0552029497cf094787c3593f804d5bce137c4b # main
    with:
      allow-test-panics: true
      cargo-args: "--locked --workspace --all-targets --all-features"
