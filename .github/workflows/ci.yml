name: Rust CI

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Test, lint, docs, EXPRESS regression
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
    with:
      rust-components: "clippy rustfmt"
      command: |
        cargo test --workspace --all-features --locked
        cargo doc --workspace --no-deps --all-features --locked
        # Validate the full EXPRESS grammar without regenerating checked-in
        # AP modules: their historical token formatting is not canonical.
        for ap in 201 203; do
          cargo run --release --locked --bin expressc -- "./schemas/APs/10303-${ap}-aim-long.exp" --check
        done

  strict-rust:
    name: Strict Rust
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@4f29271a2aa27bef1f34bd70407b0db3d39904a9 # main
    with:
      allow-test-panics: true
      cargo-args: "--locked --workspace --all-targets --all-features"

  merge-gate:
    name: Rust CI merge gate
    if: ${{ always() }}
    needs: [rust, strict-rust]
    uses: codeandsolder/ci-workflows/.github/workflows/merge-gate.yml@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
    with:
      needs-json: ${{ toJSON(needs) }}
      expected-results: |
        [["rust","success"],["strict-rust","success"]]
