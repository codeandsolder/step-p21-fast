name: Rust CI

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Test, lint, docs, EXPRESS regression
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@5b72e3865937d6e85e9ea485af9d04ec83343c5f # main
    with:
      rust-components: "clippy rustfmt"
      command: |
        cargo test --workspace --all-features --locked
        cargo doc --workspace --no-deps --all-features --locked
        # Validate the full EXPRESS grammar without regenerating checked-in
        # AP modules: their historical token formatting is not canonical.
        for ap in 201 203; do
          cargo run --release --locked --bin expressc -- "./schemas/APs/10303-${ap}-aim-long.exp" --check
        done

  strict-rust:
    name: Strict Rust
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@2defd2ef97352d7a32cddf2dc6350d685f5ed3d4 # main
    with:
      allow-test-panics: true
      cargo-args: "--locked --workspace --all-targets --all-features"

  merge-gate:
    name: Rust CI merge gate
    if: ${{ always() }}
    needs: [rust, strict-rust]
    uses: codeandsolder/ci-workflows/.github/workflows/merge-gate.yml@5b72e3865937d6e85e9ea485af9d04ec83343c5f # main
    with:
      needs-json: ${{ toJSON(needs) }}
      expected-results: |
        [["rust","success"],["strict-rust","success"]]
