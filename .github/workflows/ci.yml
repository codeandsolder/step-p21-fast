name: Rust CI

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Test, lint, docs, EXPRESS regression
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@59b38db879d10529d2bfe3ab7bc34a8c076900fd # main
    with:
      command: |
        cargo fmt --all -- --check
        cargo test --workspace --all-features --locked
        cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        cargo doc --workspace --no-deps --all-features --locked
        # Validate the full EXPRESS grammar without regenerating checked-in
        # AP modules: their historical token formatting is not canonical.
        for ap in 201 203; do
          cargo run --release --locked --bin expressc -- "./schemas/APs/10303-${ap}-aim-long.exp" --check
        done

  msrv:
    name: MSRV (release tags)
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@59b38db879d10529d2bfe3ab7bc34a8c076900fd # main
    with:
      validation-tier: release
      rust-toolchain: "1.85.0"
      rust-components: "rustfmt"
      command: |
        # Release-only MSRV builds still exercise generator snapshots with
        # the repository's pinned nightly formatter, not a floating nightly.
        mkdir -p "$RUNNER_TEMP/step-p21-tools"
        ln -s "$(env -u RUSTUP_TOOLCHAIN rustup which rustfmt)" "$RUNNER_TEMP/step-p21-tools/rustfmt"
        export PATH="$RUNNER_TEMP/step-p21-tools:$PATH"
        cargo test --workspace --all-features --locked

  strict-rust:
    name: Strict Rust
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@bc1cca5a1fdae152b14fe4399341ba41b601837f # main
    with:
      allow-test-panics: true
