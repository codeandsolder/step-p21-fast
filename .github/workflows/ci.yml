name: Rust CI

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Test, lint, docs, EXPRESS regression
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@1c9f5c8968c4caf8754c98ebeb0889d9e774b5ed # main
    with:
      rust-toolchain: "1.100.0"
      rust-components: "clippy rustfmt"
      command: |
        rustup toolchain install nightly --profile minimal --component rustfmt
        mkdir -p "$RUNNER_TEMP/step-p21-tools"
        ln -s "$(rustup which --toolchain nightly rustfmt)" "$RUNNER_TEMP/step-p21-tools/rustfmt"
        export PATH="$RUNNER_TEMP/step-p21-tools:$PATH"
        cargo +nightly fmt --all -- --check
        cargo test --workspace --all-features --locked
        cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        cargo doc --workspace --no-deps --all-features --locked
        # Validate the full EXPRESS grammar without regenerating checked-in
        # AP modules: their historical token formatting is not canonical.
        for ap in 201 203; do
          cargo run --release --locked --bin expressc -- "./schemas/APs/10303-${ap}-aim-long.exp" --check
        done

  msrv:
    name: MSRV (release tags)
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@1c9f5c8968c4caf8754c98ebeb0889d9e774b5ed # main
    with:
      validation-tier: release
      rust-toolchain: "1.85.0"
      rust-components: "rustfmt"
      command: |
        rustup toolchain install nightly --profile minimal --component rustfmt
        mkdir -p "$RUNNER_TEMP/step-p21-tools"
        ln -s "$(rustup which --toolchain nightly rustfmt)" "$RUNNER_TEMP/step-p21-tools/rustfmt"
        export PATH="$RUNNER_TEMP/step-p21-tools:$PATH"
        cargo test --workspace --all-features --locked

  strict-rust:
    name: Strict Rust
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@f01e6b6b93a444e11600b90b5ca5ff42ec4206ee # main
    with:
      allow-test-panics: true
